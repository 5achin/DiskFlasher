name: Release

# Push a tag like v1.0 to build the app and publish it as a GitHub Release.
# Running the workflow manually builds the app and keeps the zip as a
# workflow artifact without creating a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -n 1)"
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Build
        run: scripts/build.sh --zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskFlasher
          path: build/Release/DiskFlasher.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          asset="build/Release/DiskFlasher-$TAG.zip"
          mv build/Release/DiskFlasher.zip "$asset"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" --title "DiskFlasher $TAG" --generate-notes
          fi
