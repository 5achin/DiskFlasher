name: Release

# Every push to main builds the app and publishes it as a GitHub Release
# named after the app version and the build number (e.g. 1.0 build 12).
# Pushing a tag like v1.0 publishes a release under that tag instead.
# Running the workflow manually builds the app and keeps the zip as a
# workflow artifact without creating a release.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -n 1)"
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Build
        run: scripts/build.sh --zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskFlasher
          path: build/Release/DiskFlasher.zip
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Release/DiskFlasher.app/Contents/Info.plist)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            title="DiskFlasher $tag"
          else
            tag="v$version-build.$GITHUB_RUN_NUMBER"
            title="DiskFlasher $version (build $GITHUB_RUN_NUMBER)"
          fi
          asset="build/Release/DiskFlasher-$tag.zip"
          mv build/Release/DiskFlasher.zip "$asset"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --title "$title" --generate-notes
          fi
